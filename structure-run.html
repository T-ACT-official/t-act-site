<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T-ACT // STRUCTURE RUN</title>

<style>
body{
margin:0;
background:#05060a;
color:#eafcff;
font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
overflow:hidden;
}

canvas{
display:block;
margin:auto;
border-radius:18px;
}

.overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.7);
}

.card{
background:rgba(10,10,20,0.9);
padding:30px;
border-radius:20px;
text-align:center;
max-width:500px;
}

h1{
letter-spacing:.2em;
}

.tact-view{
font-family:"Yu Mincho","Hiragino Mincho ProN","serif";
font-size:20px;
line-height:1.9;
margin-top:14px;
color:#dcdcdc;
}

button{
margin-top:16px;
padding:12px 20px;
border:none;
border-radius:999px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#79fff0,#9b8cff);
}

#ranking{
position:absolute;
right:10px;
top:10px;
font-size:14px;
}

</style>
</head>

<body>

<canvas id="game" width="800" height="450"></canvas>

<div id="ranking"></div>

<div class="overlay" id="overlay">
<div class="card" id="card"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
const rankingEl = document.getElementById('ranking');

const COMMENT_MAP = {
'ノイズ':'余計な情報に埋もれたな。',
'評価':'他人の物差しに引っかかったな。',
'偏見':'固定観念に捕まったな。',
'流行':'流れに飲まれたな。',
'承認':'欲しがった時点で負けだ。',
'供給過多':'量の中で埋もれたな。',
'幻想':'現実を見失ったな。',
'数字':'数字に支配されたな。',
'比較':'他人と比べた時点でズレる。',
'期待':'他人の期待に乗ったな。'
};

const tactViewMap = {
'ノイズ':'情報を削ぎ落とせ。選択は生産だ。',
'評価':'評価は他人の都合だ。基準は自分で作れ。',
'偏見':'固定観念は思考停止の入口だ。',
'流行':'流行に乗るな。構造を読め。',
'承認':'承認は依存だ。自立しろ。',
'供給過多':'量で勝つな。設計で勝て。',
'幻想':'幻想は逃げだ。現実で戦え。',
'数字':'数字は結果であって目的じゃない。',
'比較':'比較した時点で軸を失っている。',
'期待':'他人の期待は責任を奪う。'
};

let ranking = JSON.parse(localStorage.getItem("ranking") || "null");

if(!ranking){
ranking = [
{name:"T-ACT",score:8512},
{name:"VOID",score:6200},
{name:"REX",score:5900},
{name:"ZERO",score:5200},
{name:"ALPHA",score:4800}
];
localStorage.setItem("ranking",JSON.stringify(ranking));
}

function renderRanking(){
rankingEl.innerHTML = ranking
.sort((a,b)=>b.score-a.score)
.map((r,i)=>`${i+1}. ${r.name} ${r.score}`)
.join("<br>");
}

function gameOver(hit){
const comment = COMMENT_MAP[hit] || "構造に負けたな。";
const tact = tactViewMap[hit] || "構造を見ろ。";

card.innerHTML = `
<h1>LOG ENDED</h1>
<p>衝突対象：${hit}</p>
<div class="tact-view">${tact}</div>
<p>${comment}</p>
<button onclick="location.reload()">RETRY</button>
`;
overlay.style.display="flex";
}

renderRanking();

setTimeout(()=>{
gameOver("供給過多");
},2000);

</script>

</body>
</html>
