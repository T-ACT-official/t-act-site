  <style>
    :root{
      --ink:#02040a;
      --panel:rgba(5,10,19,.76);
      --panel-2:rgba(8,16,28,.88);
      --line:rgba(115,255,241,.16);
      --line-strong:rgba(115,255,241,.42);
      --text:#eefeff;
      --soft:rgba(228,250,252,.76);
      --muted:rgba(194,228,232,.46);
      --cyan:#73fff1;
      --cyan2:#20dcc9;
      --violet:#b69cff;
      --pink:#ff5f97;
      --amber:#ffc978;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      font-family:"Avenir Next","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:
        radial-gradient(circle at 50% -15%,rgba(52,230,211,.11),transparent 34%),
        radial-gradient(circle at 86% 118%,rgba(156,106,255,.14),transparent 39%),
        linear-gradient(180deg,#03050a,#070b14 46%,#010207);
      color:var(--text);
      overscroll-behavior:none;
    }
    button,a{font:inherit}
    button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    #wrap{
      position:relative;width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      isolation:isolate;
    }
    #game-shell{
      position:fixed;
      inset:0;
      width:100dvw;
      height:100dvh;
      max-width:none;
      max-height:none;
      overflow:hidden;
      border-radius:0;
      box-shadow:none;
      background:#03050a;
    }
    canvas{
      position:absolute;inset:0;width:100%;height:100%;display:block;
      touch-action:none;background:#03050a;
      border:0;border-radius:0;
      transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s ease;
      transform-origin:center;
    }
    canvas.crash-zoom{transform:scale(1.065);filter:contrast(1.45) brightness(1.35) blur(.8px)}
    .scanlines,.grain,.chromatic,.vignette{
      position:absolute;inset:0;pointer-events:none;border-radius:0;
    }
    .scanlines{
      z-index:3;opacity:.43;
      background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);
      mix-blend-mode:screen;
    }
    .grain{
      z-index:3;opacity:.14;
      background-image:
        radial-gradient(circle at 12% 22%,rgba(255,255,255,.28) 0 1px,transparent 1px),
        radial-gradient(circle at 76% 61%,rgba(255,255,255,.18) 0 1px,transparent 1px),
        radial-gradient(circle at 43% 81%,rgba(255,255,255,.12) 0 1px,transparent 1px);
      background-size:151px 151px,217px 217px,271px 271px;
      animation:grainMove 8s linear infinite;
    }
    @keyframes grainMove{to{transform:translate3d(43px,-31px,0)}}
    .chromatic{
      z-index:4;opacity:0;mix-blend-mode:screen;
      background:linear-gradient(90deg,rgba(255,0,80,.08),transparent 8%,transparent 92%,rgba(0,238,255,.08));
    }
    .chromatic.on{animation:chromaticHit .45s ease}
    @keyframes chromaticHit{0%,100%{opacity:0}25%{opacity:1;transform:translateX(2px)}55%{opacity:.65;transform:translateX(-2px)}}
    .vignette{
      z-index:4;
      background:radial-gradient(circle at 50% 45%,transparent 48%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.64) 100%);
    }

    .hud{
      position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));z-index:7;
      display:grid;grid-template-columns:1fr minmax(300px,460px) 1fr;
      gap:10px;align-items:start;pointer-events:none;
    }
    .hud-side{display:flex;gap:8px}
    .hud-side.right{justify-content:flex-end}
    .panel{
      min-width:104px;padding:9px 12px;border-radius:12px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(8,17,29,.77),rgba(4,8,15,.61));
      backdrop-filter:blur(12px);
      box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.028);
    }
    .label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
    .value{font-size:17px;font-weight:800;letter-spacing:.07em;text-shadow:0 0 15px rgba(115,255,241,.15)}
    .hud-center{padding:9px 12px 10px;text-align:center}
    .phase-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .phase-name{font-size:10px;font-weight:850;letter-spacing:.18em;color:var(--cyan)}
    .clarity-label{font-size:8px;letter-spacing:.17em;color:var(--muted)}
    .meter{
      height:5px;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
    }
    .meter-fill{
      height:100%;width:0;border-radius:inherit;
      background:linear-gradient(90deg,var(--cyan2),var(--cyan),var(--violet));
      box-shadow:0 0 14px rgba(115,255,241,.38);
      transition:width .1s linear;
    }
    .meter.ready .meter-fill{animation:meterPulse .6s ease-in-out infinite alternate}
    @keyframes meterPulse{to{filter:brightness(1.65);box-shadow:0 0 25px rgba(115,255,241,.85)}}

    .top-tools{
      position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:7px;
    }
    .tool-btn{
      min-width:38px;height:38px;padding:0 10px;margin:0;border-radius:11px;
      border:1px solid var(--line);color:rgba(238,254,255,.68);
      background:rgba(5,10,18,.70);backdrop-filter:blur(10px);
      cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.06em;
      transition:.16s ease;
    }
    .tool-btn:hover{border-color:var(--line-strong);color:#fff}
    .brand-chip{
      position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:6;pointer-events:none;
      font-size:8px;letter-spacing:.18em;color:rgba(207,242,246,.27);text-transform:uppercase;
    }

    #controls{
      position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
      z-index:8;display:flex;gap:18px;align-items:center;
    }
    .control-btn{
      min-width:72px;min-height:43px;padding:10px 16px;margin:0;border-radius:13px;
      border:1px solid var(--line);color:var(--text);
      background:rgba(7,13,23,.72);backdrop-filter:blur(10px);
      cursor:pointer;font-size:17px;font-weight:850;
      box-shadow:0 8px 26px rgba(0,0,0,.19);
      user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
      transition:.14s ease;
    }
    .control-btn:active{transform:scale(.955)}
    .focus-btn{
      min-width:124px;font-size:9px;letter-spacing:.14em;
      color:rgba(255,255,255,.38);border-color:rgba(182,156,255,.17);
    }
    .focus-btn.ready{
      color:#041010;border-color:rgba(115,255,241,.62);
      background:linear-gradient(90deg,var(--cyan),#ad99ff);
      box-shadow:0 0 27px rgba(115,255,241,.26);
    }
    .focus-btn.active{
      color:#041010;background:#fff;
      box-shadow:0 0 36px rgba(255,255,255,.48);
    }

    .system-log{
      position:absolute;left:18px;top:94px;z-index:6;
      width:min(31vw,350px);pointer-events:none;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .log-line{
      min-height:16px;margin-bottom:5px;
      font-size:9px;letter-spacing:.04em;color:rgba(184,229,232,.28);
      text-shadow:0 0 10px rgba(115,255,241,.08);
      transition:opacity .3s ease,color .3s ease;
    }
    .log-line.live{color:rgba(115,255,241,.62)}
    .log-line.warn{color:rgba(255,201,120,.72)}
    .log-line.hit{color:rgba(255,95,151,.76)}

    .story-caption{
      position:absolute;left:50%;bottom:77px;z-index:7;
      transform:translateX(-50%);
      width:min(78%,760px);text-align:center;pointer-events:none;
      opacity:0;
    }
    .story-caption.show{animation:captionIn 2.35s ease both}
    .story-caption small{
      display:block;margin-bottom:5px;color:rgba(115,255,241,.52);
      font-size:8px;letter-spacing:.24em;text-transform:uppercase;
    }
    .story-caption strong{
      font-size:clamp(15px,2vw,23px);font-weight:650;letter-spacing:.035em;
      color:rgba(242,254,255,.92);text-shadow:0 0 22px rgba(115,255,241,.16);
    }
    @keyframes captionIn{
      0%{opacity:0;transform:translate(-50%,8px);filter:blur(5px)}
      14%,75%{opacity:1;transform:translate(-50%,0);filter:blur(0)}
      100%{opacity:0;transform:translate(-50%,-5px);filter:blur(3px)}
    }

    .phase-banner{
      position:absolute;left:50%;top:49%;z-index:9;pointer-events:none;
      transform:translate(-50%,-50%);text-align:center;opacity:0;
    }
    .phase-banner.show{animation:phaseIn 1.45s ease both}
    .phase-banner small{display:block;margin-bottom:4px;color:var(--cyan);font-size:9px;letter-spacing:.30em}
    .phase-banner strong{font-size:clamp(34px,7vw,74px);letter-spacing:.14em;text-shadow:0 0 32px rgba(115,255,241,.23)}
    @keyframes phaseIn{
      0%{opacity:0;filter:blur(9px);transform:translate(-50%,-50%) scale(.91)}
      18%,70%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;filter:blur(5px);transform:translate(-50%,-50%) scale(1.04)}
    }

    .focus-flash,.crash-flash,.whiteout{
      position:absolute;inset:0;pointer-events:none;border-radius:0;
    }
    .focus-flash{z-index:10;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(115,255,241,.07) 44%,transparent 72%)}
    .focus-flash.on{animation:focusPulse .72s ease}
    @keyframes focusPulse{0%{opacity:0}24%{opacity:1}100%{opacity:0}}
    .crash-flash{z-index:15;background:#fff;opacity:1;transition:opacity .58s ease}
    .whiteout{z-index:16;background:#efffff;opacity:0}
    .whiteout.on{animation:whiteout 2.8s ease both}
    @keyframes whiteout{0%{opacity:0}20%{opacity:.95}48%{opacity:1}100%{opacity:0}}

    .overlay{
      position:absolute;inset:0;z-index:12;
      display:flex;align-items:center;justify-content:center;
      padding:18px;border-radius:0;
      background:
        radial-gradient(circle at 50% 36%,rgba(30,58,69,.24),transparent 37%),
        rgba(1,3,8,.76);
      backdrop-filter:blur(7px);
    }
    .card{
      position:relative;width:min(94%,700px);padding:31px 32px 28px;text-align:center;
      border:1px solid rgba(115,255,241,.18);border-radius:23px;
      background:
        linear-gradient(180deg,rgba(8,16,29,.94),rgba(3,7,13,.91));
      box-shadow:0 28px 90px rgba(0,0,0,.47),inset 0 1px 0 rgba(255,255,255,.035);
      overflow:hidden;
    }
    .card::before{
      content:"";position:absolute;inset:-1px;pointer-events:none;
      background:linear-gradient(108deg,transparent 16%,rgba(115,255,241,.055),transparent 43%);
    }
    .card::after{
      content:"";position:absolute;left:0;top:0;width:100%;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.45;
    }
    .kicker{margin:0 0 9px;font-size:9px;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase}
    .card h1,.card h2{margin:0 0 10px;line-height:1.08;letter-spacing:.085em}
    .card h1{font-size:clamp(31px,5vw,54px)}
    .card h2{font-size:clamp(27px,4vw,42px)}
    .card p{margin:9px auto;max-width:570px;line-height:1.76;color:var(--soft)}
    .lead{font-size:13px}
    .danger{color:var(--violet);text-shadow:0 0 14px rgba(182,156,255,.36)}
    .accent{color:var(--cyan);text-shadow:0 0 14px rgba(115,255,241,.30)}
    .amber{color:var(--amber)}
    .howto{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 7px}
    .howto div{
      padding:11px 8px;border:1px solid rgba(255,255,255,.065);border-radius:11px;
      background:rgba(255,255,255,.023);
    }
    .howto b{display:block;margin-bottom:4px;font-size:10px;color:var(--cyan);letter-spacing:.09em}
    .howto span{font-size:9px;color:var(--muted);line-height:1.5}
    .card-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:17px}
    .card button,.card a{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:43px;padding:10px 17px;margin:0;border-radius:999px;
      border:1px solid rgba(115,255,241,.23);
      text-decoration:none;cursor:pointer;font-weight:850;font-size:10px;letter-spacing:.10em;
      transition:.15s ease;
    }
    .card button:hover,.card a:hover{transform:translateY(-1px)}
    .primary{
      color:#041010;background:linear-gradient(90deg,var(--cyan),#a996ff);
      box-shadow:0 0 24px rgba(115,255,241,.19);
    }
    .secondary{color:var(--soft);background:rgba(255,255,255,.03)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:17px 0 0}
    .stat{padding:11px 6px;border-radius:11px;background:rgba(255,255,255,.023);border:1px solid rgba(255,255,255,.055)}
    .stat b{display:block;font-size:15px;color:#fff}
    .stat span{font-size:7px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
    .ending-mark{
      width:42px;height:42px;margin:0 auto 14px;border:1px solid rgba(115,255,241,.35);
      transform:rotate(45deg);box-shadow:0 0 30px rgba(115,255,241,.16);
      position:relative;
    }
    .ending-mark::after{
      content:"";position:absolute;inset:10px;border:1px solid rgba(182,156,255,.5);
    }
    .microcopy{font-size:9px!important;color:rgba(201,231,235,.39)!important;letter-spacing:.08em}

    @media(max-width:760px){
      #game-shell{width:100vw;height:100vh;border-radius:0}
      canvas,.scanlines,.grain,.chromatic,.vignette,.overlay,.focus-flash,.crash-flash,.whiteout{border-radius:0}
      .hud{top:max(7px,env(safe-area-inset-top));left:max(7px,env(safe-area-inset-left));right:max(7px,env(safe-area-inset-right));grid-template-columns:1fr 1.3fr 1fr;gap:5px}
      .panel{min-width:0;padding:7px 8px;border-radius:9px}
      .value{font-size:14px}.label{font-size:7px}
      .hud-side{gap:4px}.hud-side .panel:nth-child(2){display:none}
      .hud-center{padding:6px 8px 7px}
      .phase-name{font-size:8px}.clarity-label{font-size:7px}
      .system-log{left:10px;top:67px;width:42vw}.log-line{font-size:7px;margin-bottom:3px}
      #controls{bottom:max(8px,env(safe-area-inset-bottom));gap:10px}
      .control-btn{min-width:58px;min-height:42px;padding:9px 11px}
      .focus-btn{min-width:96px;font-size:8px}
      .brand-chip{display:none}.top-tools{right:max(7px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));gap:4px}
      .tool-btn{height:36px;min-width:34px;padding:0 7px;font-size:8px}
      .story-caption{bottom:59px;width:88%}.story-caption strong{font-size:13px}
      .card{padding:25px 17px 21px}
      .howto{grid-template-columns:1fr}.howto div{padding:8px}
      .stats{grid-template-columns:repeat(2,1fr)}
    }
    }
    @media(prefers-reduced-motion:reduce){
      .grain{animation:none}.phase-banner.show,.story-caption.show,.focus-flash.on{animation-duration:.01ms}
    }
#btnRight{right:max(150px,env(safe-area-inset-right))}
    }

  
    /* ===== Portrait Play Mode: "read ahead" layout ===== */
    @media (max-width:760px) and (orientation:portrait){
      .hud{
        top:max(8px,env(safe-area-inset-top));
        left:max(8px,env(safe-area-inset-left));
        right:max(8px,env(safe-area-inset-right));
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-areas:
          "score flow"
          "clarity clarity";
        gap:6px;
      }
      .hud-side:first-child{grid-area:score;justify-content:flex-start}
      .hud-side.right{grid-area:flow;justify-content:flex-end}
      .hud-center{grid-area:clarity}
      .hud-side .panel{flex:1}
      .hud-side .panel:nth-child(2){display:none}
      .hud-center{padding:7px 9px 8px}
      .phase-line{gap:8px}
      .phase-name{font-size:9px}
      .clarity-label{font-size:7px}
      .meter{height:6px}

      .system-log{display:none}
      .brand-chip{display:none}
      .top-tools{
        top:max(106px,calc(env(safe-area-inset-top) + 98px));
        right:max(8px,env(safe-area-inset-right));
        bottom:auto;
        gap:4px;
      }
      .tool-btn{
        height:32px;
        min-width:32px;
        padding:0 7px;
        font-size:7px;
        opacity:.72;
      }

      #controls{
        left:0;
        right:0;
        bottom:max(10px,env(safe-area-inset-bottom));

        grid-template-columns:1fr auto 1fr;

      .howto{grid-template-columns:1fr;gap:6px}

    }

  </style>
</head>
<body>
  <div id="wrap">
    <div id="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="STRUCTURE RUN game area"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="chromatic" id="chromatic" aria-hidden="true"></div>

          <div class="panel"><div class="label">record</div><div class="value" id="score">000000</div></div>

        </div>
        <div class="panel hud-center">

  </div>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const shell = document.getElementById('game-shell');
    const overlay = document.getElementById('overlay');
    const card = document.getElementById('card');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const phaseEl = document.getElementById('phase');
    const nearMissEl = document.getElementById('nearMiss');
    const comboEl = document.getElementById('combo');
    const clarityLabel = document.getElementById('clarityLabel');
    const clarityFill = document.getElementById('clarityFill');
    const clarityMeter = document.getElementById('clarityMeter');
    const phaseBanner = document.getElementById('phaseBanner');
    const phaseBannerText = document.getElementById('phaseBannerText');
    const focusFlash = document.getElementById('focusFlash');
    const chromatic = document.getElementById('chromatic');
    const storyCaption = document.getElementById('storyCaption');
    const storyText = document.getElementById('storyText');
    const systemLog = document.getElementById('systemLog');
    const whiteout = document.getElementById('whiteout');

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnFocus = document.getElementById('btnFocus');
    const soundBtn = document.getElementById('soundBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let W = canvas.width, H = canvas.height;
    let portraitMode = false;
    const OFFICIAL_URL = 'https://t-act-official.site/';
    const BEST_KEY = 'tactStructureRunBestV3';
    const CLEAR_KEY = 'tactStructureRunClearV3';

    const WORD_DATA = [
      {word:'評価', truth:'他人の物差しは、あなたの軸ではない。', en:'WHO SET THE VALUE?'},
      {word:'偏見', truth:'固定観念は、考える前に答えを決めてしまう。', en:'THINK BEFORE LABELS.'},
      {word:'流行', truth:'流れを見ることと、流されることは違う。', en:'READ THE FLOW. KEEP YOUR AXIS.'},
      {word:'承認', truth:'認められることを目的にすると、自分が遠くなる。', en:'APPROVAL IS NOT IDENTITY.'},
      {word:'供給過多', truth:'量の中で埋もれるなら、設計で抜ける。', en:'DESIGN BEATS VOLUME.'},
      {word:'幻想', truth:'現実を見ることは、夢を捨てることではない。', en:'REALITY IS NOT SURRENDER.'},
      {word:'数字', truth:'数字は結果を映す。目的までは決めない。', en:'NUMBERS ARE NOT THE PURPOSE.'},
      {word:'比較', truth:'比べる相手を間違えると、軸を失う。', en:'COMPARE LESS. OBSERVE MORE.'},
      {word:'期待', truth:'期待に応えることと、期待に支配されることは違う。', en:'EXPECTATION IS NOT OWNERSHIP.'},
      {word:'ノイズ', truth:'全部を受け取る必要はない。選ぶことも創作だ。', en:'FILTER THE NOISE.'}
    ];
    const SIGNAL_WORDS = ['記憶','選択','余白','温度','継続','実感'];

    const PHASES = [
      {name:'BOOT', at:0, caption:'最初に見えるものが、本質とは限らない。'},
      {name:'PRESSURE', at:2200, caption:'評価が増えるほど、自分の基準は見えにくくなる。'},
      {name:'DENSITY', at:5200, caption:'情報が増えた時こそ、何を捨てるかが輪郭になる。'},
      {name:'OVERLOAD', at:9000, caption:'数字も承認も使えばいい。支配されなければ。'},
      {name:'SYSTEM BREAK', at:13200, caption:'構造は消せない。なら、読んで抜ける。'}
    ];

    const bgm = new Audio('genbakantoku_bgm.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.68;

    let audioCtx = null;
    let soundOn = true;
    function ensureAudio(){
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(freq=440,duration=.08,type='sine',gain=.025,delay=0){
      if(!soundOn) return;
      ensureAudio();
      if(!audioCtx) return;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);
      g.gain.setValueAtTime(gain,audioCtx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+duration);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+duration);
    }
    const sfx={
      ui(){tone(530,.04,'sine',.018);},
      near(){tone(720,.05,'sine',.025);tone(1040,.07,'sine',.014,.03);},
      collect(){tone(550,.055,'triangle',.022);tone(820,.07,'triangle',.016,.04);},
      phase(){tone(250,.12,'triangle',.028);tone(390,.16,'triangle',.022,.08);tone(610,.20,'triangle',.017,.15);},
      focus(){tone(190,.24,'sine',.034);tone(380,.28,'sine',.022,.05);tone(760,.34,'sine',.015,.11);},
      break(){tone(160,.05,'sawtooth',.019);},
      crash(){tone(88,.28,'sawtooth',.05);tone(54,.44,'square',.018,.05);},
      clear(){tone(260,.25,'sine',.028);tone(390,.31,'sine',.022,.09);tone(520,.36,'sine',.019,.18);tone(780,.44,'sine',.014,.28);}
    };

    const input={left:false,right:false,pointer:false,targetX:W/2};
    let state='title';
    let beforePause='running';
    let score=0;
    let best=Number(localStorage.getItem(BEST_KEY)||0);
    let cleared=Number(localStorage.getItem(CLEAR_KEY)||0);
    let frame=0,countdown=0;
    let nearMisses=0,combo=1,maxCombo=1,comboTimer=0;
    let clarity=0,focusTimer=0;
    let currentPhase=0,lastPhase=0;
    let spawnTimer=0,signalTimer=0;
    let lastHit={word:'構造',truth:'構造を見ろ。',en:'READ THE STRUCTURE.'};
    let shake=0;
    let obstacles=[],particles=[],trails=[],signals=[],city=[],rain=[],stars=[],backgroundWords=[];
    let finalSequence=false,finalGateSpawned=false,finalGatePassed=false,clearTimer=0;
    let captionLocked=false;

    const player={x:W/2,y:H-165,w:30,h:38,vx:0,tilt:0,glow:0};


    function resizeGame(){
      const rect=shell.getBoundingClientRect();
      const aspect=Math.max(.38,rect.width/Math.max(1,rect.height));
      portraitMode=rect.height>rect.width*1.08;

      if(portraitMode){
        // Tall logical world: more time to read what is coming.
        W=540;
        H=Math.round(W/aspect);
        H=clamp(H,900,1280);
      }else{
        H=720;
        W=Math.round(H*aspect);
        W=clamp(W,900,1800);
      }

      canvas.width=W;
      canvas.height=H;
      player.y=H-(portraitMode?190:165);
      player.x=clamp(player.x,28,W-28);
      input.targetX=clamp(input.targetX,0,W);
      seedWorld();
    }

    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const pad=n=>String(Math.max(0,Math.floor(n))).padStart(6,'0');
    const rand=(a,b)=>a+Math.random()*(b-a);

    function seedWorld(){
      stars=[];city=[];rain=[];backgroundWords=[];
      for(let i=0;i<100;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1),s:rand(.3,1.8)});
      for(let i=0;i<26;i++) city.push({x:i*55+rand(-18,18),w:rand(26,66),h:rand(58,210),layer:i%3,seed:Math.random()*999});
      for(let i=0;i<55;i++) rain.push({x:Math.random()*W,y:Math.random()*H,l:rand(6,22),s:rand(4,10),a:rand(.025,.11)});
      for(let i=0;i<12;i++) backgroundWords.push({data:WORD_DATA[i%WORD_DATA.length],x:rand(65,W-65),y:rand(90,H-40),speed:rand(.16,.43),alpha:rand(.02,.05)});
    }
    seedWorld();
    resizeGame();
    addEventListener("resize",()=>{ clearTimeout(window.__srResize); window.__srResize=setTimeout(resizeGame,80); });
    if(window.visualViewport){ visualViewport.addEventListener("resize",()=>{ clearTimeout(window.__srVV); window.__srVV=setTimeout(resizeGame,60); }); }

    function titleHtml(){
      return `
        <p class="kicker">T-ACT / INTERACTIVE RECORD</p>
        <h1>STRUCTURE RUN</h1>
        <p class="lead"><span class="danger">構造を避けるだけでは足りない。読め。</span><br>
        評価、偏見、流行、承認、数字、比較。先を読み、現実にある“構造”の中を、自分の軸で走る。</p>
        <div class="howto">
          <div><b>MOVE</b><span>← → / A D / 画面ドラッグ</span></div>
          <div><b>READ</b><span>ニアミスとSIGNALでCLARITYを貯める</span></div>
          <div><b>BREAK</b><span>100%で SPACE / FOCUS。構造の裏側が見える</span></div>
        </div>
        <p class="microcopy">HEADPHONES RECOMMENDED · NO INSTALL · MOBILE READY</p>
        <div class="card-actions">
          <button id="startBtn" class="primary">ENTER STRUCTURE</button>
          <button id="aboutBtn" class="secondary">ABOUT THIS WORK</button>
          <a class="secondary" href="${OFFICIAL_URL}">T-ACT WORLD</a>
        </div>`;
    }

    function aboutHtml(){
      return `
        <p class="kicker">ABOUT THIS WORK</p>
        <h2>思考を、操作にする。</h2>
        <p class="lead">音楽では「聴く」。言葉では「読む」。<br>
        STRUCTURE RUNでは、評価・偏見・流行・承認・数字・比較といった現実の構造を、<span class="accent">自分の操作で通過する。</span></p>
        <p>避けるだけでは終わらない。ぎりぎりまで見て、読み、必要な時だけ構造を壊す。<br>
        その判断そのものが、この作品の記録です。</p>
        <div class="card-actions"><button id="backBtn" class="primary">BACK</button></div>`;
    }

    function resultHtml(){
      return `
        <p class="kicker">RECORD ENDED</p>
        <h2>LOG ENDED</h2>
        <p class="lead">衝突対象：<span class="danger">${lastHit.word}</span><br>
        <span class="accent">${lastHit.truth}</span></p>
        <p class="microcopy">${lastHit.en}</p>
        <div class="stats">
          <div class="stat"><b>${pad(score)}</b><span>record</span></div>
          <div class="stat"><b>${pad(best)}</b><span>best</span></div>
          <div class="stat"><b>${nearMisses}</b><span>near miss</span></div>
          <div class="stat"><b>x${maxCombo}</b><span>max flow</span></div>
        </div>
        <div class="card-actions">
          <button id="restartBtn" class="primary">RE-ENTER</button>
          <a class="secondary" href="${OFFICIAL_URL}">ENTER T-ACT WORLD</a>
        </div>`;
    }

    function endingHtml(){
      return `
        <div class="ending-mark"></div>
        <p class="kicker">SYSTEM BREAK / RECORD COMPLETE</p>
        <h2>構造の外側。</h2>
        <p class="lead">構造は、なくならない。<br>
        評価も、数字も、期待も、比較も。<br><br>
        <span class="accent">それでも、自分の軸で抜けていく。</span></p>
        <p>正解を見つけたわけじゃない。<br>ただ、自分で選んでここまで来た。</p>
        <p class="microcopy">T-ACT — PLAY MY THOUGHTS.</p>
        <div class="stats">
          <div class="stat"><b>${pad(score)}</b><span>record</span></div>
          <div class="stat"><b>${nearMisses}</b><span>near miss</span></div>
          <div class="stat"><b>x${maxCombo}</b><span>max flow</span></div>
          <div class="stat"><b>${cleared}</b><span>cleared</span></div>
        </div>
        <div class="card-actions">
          <button id="againBtn" class="primary">RUN AGAIN</button>
          <a class="secondary" href="${OFFICIAL_URL}">ENTER T-ACT WORLD</a>
        </div>`;
    }

    function pauseHtml(){
      return `
        <p class="kicker">SYSTEM HOLD</p>
        <h2>PAUSED</h2>
        <p>構造は止まっている。<br>軸を戻したら、また進めばいい。</p>
        <div class="card-actions"><button id="resumeBtn" class="primary">RESUME</button></div>`;
    }

    function setCard(html){card.innerHTML=html}
    function bindTitle(){
      document.getElementById('startBtn').addEventListener('click',()=>{sfx.ui();resetGame()},{once:true});
      document.getElementById('aboutBtn').addEventListener('click',()=>{sfx.ui();setCard(aboutHtml());document.getElementById('backBtn').addEventListener('click',()=>{sfx.ui();showTitle()},{once:true})},{once:true});
    }
    function showTitle(){
      state='title';pauseBgm();overlay.style.display='flex';setCard(titleHtml());bindTitle();updateHud();
    }

    async function playBgm(){
      if(!soundOn)return;
      try{bgm.currentTime=0;await bgm.play()}catch(e){}
    }
    function pauseBgm(){bgm.pause()}
    function resumeBgm(){if(soundOn&&state==='running')bgm.play().catch(()=>{})}

    function resetGame(){
      ensureAudio();
      score=0;frame=0;nearMisses=0;combo=1;maxCombo=1;comboTimer=0;
      clarity=0;focusTimer=0;currentPhase=0;lastPhase=0;spawnTimer=34;signalTimer=110;
      lastHit={word:'構造',truth:'構造を見ろ。',en:'READ THE STRUCTURE.'};
      shake=0;obstacles=[];particles=[];trails=[];signals=[];
      finalSequence=false;finalGateSpawned=false;finalGatePassed=false;clearTimer=0;captionLocked=false;
      player.x=W/2;player.y=H-(portraitMode?190:165);player.vx=0;player.tilt=0;player.glow=0;
      input.left=false;input.right=false;input.pointer=false;input.targetX=W/2;
      countdown=165;state='countdown';overlay.style.display='none';
      writeLog('> route reset / '+(portraitMode?'PORTRAIT READ MODE':'WIDE IMMERSION MODE'),'live');
      playBgm();updateHud();
    }

    function difficulty(){return 1+Math.min(score/3300,4.15)}
    function phaseIndex(){
      let idx=0;
      for(let i=0;i<PHASES.length;i++)if(score>=PHASES[i].at)idx=i;
      return idx;
    }

    function writeLog(text,type=''){
      const lines=[...systemLog.querySelectorAll('.log-line')];
      lines.shift()?.remove();
      const div=document.createElement('div');
      div.className='log-line '+type;div.textContent=text;
      systemLog.appendChild(div);
    }

    function showCaption(text,force=false){
      if(captionLocked&&!force)return;
      storyText.textContent=text;storyCaption.classList.remove('show');void storyCaption.offsetWidth;storyCaption.classList.add('show');
    }
    function showPhase(p){
      phaseBannerText.textContent=p.name;phaseBanner.classList.remove('show');void phaseBanner.offsetWidth;phaseBanner.classList.add('show');
      showCaption(p.caption);writeLog('> phase_shift: '+p.name,'warn');sfx.phase();
    }

    function updateHud(){
      bestEl.textContent=pad(best);scoreEl.textContent=pad(score);
      nearMissEl.textContent=String(nearMisses).padStart(2,'0');comboEl.textContent='x'+combo;
      phaseEl.textContent=focusTimer>0?'STRUCTURE READ':PHASES[currentPhase].name;
      clarityLabel.textContent=focusTimer>0?'READING…':`CLARITY ${Math.floor(clarity)}%`;
      clarityFill.style.width=(focusTimer>0?(focusTimer/210*100):clarity)+'%';
      clarityMeter.classList.toggle('ready',clarity>=100&&focusTimer<=0);
      btnFocus.classList.toggle('ready',clarity>=100&&focusTimer<=0);
      btnFocus.classList.toggle('active',focusTimer>0);
      btnFocus.textContent=focusTimer>0?'READING':(clarity>=100?'FOCUS READY':'FOCUS');
      soundBtn.textContent=soundOn?'SOUND':'MUTED';
      pauseBtn.textContent=state==='paused'?'RESUME':'PAUSE';
    }

    function emit(x,y,color,count=10,spread=1){
      for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*8*spread,vy:(Math.random()-.5)*8*spread,life:22+Math.random()*26,max:48,size:1+Math.random()*3,color});
    }

    function activateFocus(){
      if(state!=='running'||focusTimer>0||clarity<100)return;
      clarity=0;focusTimer=210;focusFlash.classList.remove('on');void focusFlash.offsetWidth;focusFlash.classList.add('on');
      chromatic.classList.remove('on');void chromatic.offsetWidth;chromatic.classList.add('on');
      shake=5;showCaption('見えているものの裏に、構造がある。');writeLog('> structure_read: ON','live');sfx.focus();updateHud();
    }

    function obstacle(data,x,y,w,h,type='block',drift=0){
      obstacles.push({data,x,y,w,h,type,drift,speed:4.85+difficulty()*.88,pulse:Math.random()*Math.PI*2,passed:false,scored:false});
    }

    function spawnPattern(){
      if(finalSequence)return;
      const d=difficulty(), datum=WORD_DATA[Math.floor(Math.random()*WORD_DATA.length)], y=-86;
      const roll=Math.random();
      const margin=portraitMode?22:35;

      if(d>2.0 && roll<.30){
        // In portrait, gates stay wide enough to be read and planned for.
        const minGap=portraitMode?Math.max(190,W*.38):225;
        const maxGap=portraitMode?Math.max(230,W*.48):300;
        const gapW=portraitMode
          ? clamp(W*(.50-d*.018),minGap,maxGap)
          : clamp(330-d*14,minGap,maxGap);

        const centerMin=gapW/2+margin+18;
        const centerMax=W-gapW/2-margin-18;
        const center=rand(centerMin,Math.max(centerMin+1,centerMax));
        const leftW=center-gapW/2, rightX=center+gapW/2;
        const drift=(Math.random()-.5)*(portraitMode?.34:(d>3?1.0:.45));

        obstacle(datum,0,y,leftW,portraitMode?54:46,'gate',drift);
        obstacle(
          WORD_DATA[Math.floor(Math.random()*WORD_DATA.length)],
          rightX,y,W-rightX,portraitMode?54:46,'gate',drift
        );

      }else if(d>2.8 && roll<.48){
        const w=portraitMode?rand(W*.18,W*.27):rand(72,115);
        const x=rand(margin,W-w-margin);
        obstacle(
          datum,x,y,w,portraitMode?58:52,'scanner',
          (Math.random()<.5?-1:1)*rand(portraitMode?.25:.40,portraitMode?.60:.90)
        );

      }else{
        const wide=Math.random()<.34;
        const w=portraitMode
          ? (wide?rand(W*.32,W*.52):rand(W*.14,W*.24))
          : (wide?rand(165,320):rand(52,105));
        const x=rand(margin,W-w-margin);
        obstacle(
          datum,x,y,w,
          portraitMode?rand(48,66):rand(40,58),
          wide?'wall':'block',
          d>3.1?(Math.random()-.5)*(portraitMode?.40:.85):0
        );
      }
    }

    function spawnSignal(){
      if(finalSequence)return;
      signals.push({x:rand(portraitMode?48:90,W-(portraitMode?48:90)),y:-35,r:portraitMode?12:10,spin:Math.random()*Math.PI*2,speed:(portraitMode?3.9:4.2)+difficulty()*.50,word:SIGNAL_WORDS[Math.floor(Math.random()*SIGNAL_WORDS.length)]});
    }

    function nearMissCheck(ob){
      if(ob.passed||ob.y>player.y+player.h/2+12||ob.y+ob.h<player.y-player.h/2)return;
      const overlap=player.x+player.w/2>ob.x&&player.x-player.w/2<ob.x+ob.w;
      if(overlap)return;
      const gap=Math.min(Math.abs((player.x-player.w/2)-(ob.x+ob.w)),Math.abs(ob.x-(player.x+player.w/2)));
      if(gap<50){
        ob.passed=true;nearMisses++;combo=clamp(combo+1,1,9);maxCombo=Math.max(maxCombo,combo);comboTimer=160;
        clarity=clamp(clarity+16+combo*1.8,0,100);score+=80*combo;emit(player.x,player.y,'115,255,241',11,.7);
        writeLog('> near_miss + clarity','live');sfx.near();
      }
    }

    function hitTest(ob){
      return player.x+player.w/2>ob.x&&player.x-player.w/2<ob.x+ob.w&&player.y+player.h/2>ob.y&&player.y-player.h/2<ob.y+ob.h;
    }
    function signalHit(s){
      const dx=player.x-s.x,dy=player.y-s.y;
      return dx*dx+dy*dy<34*34;
    }

    function crash(datum){
      if(state!=='running')return;
      state='gameover';lastHit=datum;pauseBgm();sfx.crash();
      if(score>best){best=Math.floor(score);localStorage.setItem(BEST_KEY,String(best))}
      writeLog('> collision: '+datum.word,'hit');
      chromatic.classList.remove('on');void chromatic.offsetWidth;chromatic.classList.add('on');
      canvas.classList.add('crash-zoom');
      const f=document.createElement('div');f.className='crash-flash';shell.appendChild(f);
      setTimeout(()=>f.style.opacity='0',70);
      setTimeout(()=>{
        f.remove();canvas.classList.remove('crash-zoom');setCard(resultHtml());overlay.style.display='flex';
        document.getElementById('restartBtn').addEventListener('click',()=>{sfx.ui();resetGame()},{once:true});updateHud();
      },620);
    }

    function startFinalSequence(){
      if(finalSequence)return;
      finalSequence=true;captionLocked=true;obstacles=[];signals=[];spawnTimer=9999;signalTimer=9999;
      writeLog('> FINAL GATE detected','warn');
      phaseBannerText.textContent='SYSTEM BREAK';phaseBanner.classList.remove('show');void phaseBanner.offsetWidth;phaseBanner.classList.add('show');
      sfx.phase();
      setTimeout(()=>{finalGateSpawned=true;spawnFinalGate();},900);
    }

    function spawnFinalGate(){
      const gapW=portraitMode?Math.max(210,W*.42):220;
      const finalMargin=portraitMode?36:180;
      const gapCenter=clamp(player.x+rand(portraitMode?-90:-160,portraitMode?90:160),finalMargin+gapW/2,W-finalMargin-gapW/2);
      const data={word:'STRUCTURE',truth:'構造は消えない。それでも、自分の軸で抜けていく。',en:'THE STRUCTURE REMAINS. KEEP YOUR AXIS.'};
      obstacle(data,0,-120,gapCenter-gapW/2,82,'final',0);
      obstacle(data,gapCenter+gapW/2,-120,W-(gapCenter+gapW/2),82,'final',0);
      obstacles.forEach(o=>{o.speed=5.4;o.final=true});
      showCaption('最後に残るのは、正解じゃない。自分で選んだ軸だ。',true);
    }

    function completeRun(){
      if(state==='clear')return;
      state='clear';pauseBgm();sfx.clear();cleared++;localStorage.setItem(CLEAR_KEY,String(cleared));
      if(score>best){best=Math.floor(score);localStorage.setItem(BEST_KEY,String(best))}
      whiteout.classList.remove('on');void whiteout.offsetWidth;whiteout.classList.add('on');
      writeLog('> SYSTEM BREAK / record complete','live');
      setTimeout(()=>{
        setCard(endingHtml());overlay.style.display='flex';
        document.getElementById('againBtn').addEventListener('click',()=>{sfx.ui();resetGame()},{once:true});
      },1600);
    }

    function updatePlayer(){
      let desired=0;if(input.left)desired--;if(input.right)desired++;
      const accel=portraitMode?1.85:1.55;
      const maxSpeed=portraitMode?17.8:15.8;
      const pointerGain=portraitMode?.037:.030;
      const pointerAccel=portraitMode?2.5:2.1;

      if(input.pointer){
        const dx=input.targetX-player.x;
        player.vx+=clamp(dx*pointerGain,-pointerAccel,pointerAccel);
      }else{
        player.vx+=desired*accel;
      }

      player.vx*=portraitMode?.78:.80;
      player.vx=clamp(player.vx,-maxSpeed,maxSpeed);
      player.x=clamp(player.x+player.vx,27,W-27);
      player.tilt+=((player.vx/maxSpeed)-player.tilt)*.16;
      player.glow+=.13;

      trails.push({x:player.x,y:player.y+18,vx:-player.vx*.04,life:22,max:22});
      if(trails.length>92)trails.shift();
    }

    function update(){
      if(state==='paused'||state==='title'||state==='gameover'||state==='clear')return;
      if(state==='countdown'){
        countdown--;updatePlayer();
        if(countdown<=0){state='running';showPhase(PHASES[0]);}
        return;
      }
      if(state!=='running')return;

      frame++;
      const focus=focusTimer>0,timeScale=focus?.43:1;
      score+=(1+(combo-1)*.05)*(focus?1.20:1);
      clarity=clamp(clarity+.020,0,100);
      if(focusTimer>0)focusTimer--;

      currentPhase=phaseIndex();
      if(currentPhase!==lastPhase){
        lastPhase=currentPhase;showPhase(PHASES[currentPhase]);
      }
      if(score>=15600&&!finalSequence)startFinalSequence();

      if(comboTimer>0)comboTimer--;else if(combo>1){combo--;comboTimer=58}
      updatePlayer();

      spawnTimer-=timeScale;
      if(spawnTimer<=0){
        spawnPattern();spawnTimer=portraitMode
          ? Math.max(24,60-difficulty()*3.8-Math.random()*6)
          : Math.max(20,54-difficulty()*4.2-Math.random()*7);
      }
      signalTimer-=timeScale;
      if(signalTimer<=0){
        spawnSignal();signalTimer=rand(150,245)-difficulty()*8;
      }

      for(let i=obstacles.length-1;i>=0;i--){
        const ob=obstacles[i];ob.y+=ob.speed*timeScale;ob.x+=ob.drift*timeScale;
        if(ob.x<0||ob.x+ob.w>W)ob.drift*=-1;ob.pulse+=.055;
        nearMissCheck(ob);

        if(hitTest(ob)){
          if(focus){
            score+=170*combo;clarity=clamp(clarity+2,0,100);emit(player.x,player.y,'182,156,255',28,1.25);
            writeLog('> bypass: '+ob.data.word,'live');obstacles.splice(i,1);shake=6;sfx.break();continue;
          }else{crash(ob.data);return}
        }

        if(ob.final&&ob.y>player.y+player.h/2+16&&!ob.scored){
          ob.scored=true;
          const finals=obstacles.filter(x=>x.final);
          if(finals.every(x=>x.scored||x===ob)){
            finalGatePassed=true;clearTimer=90;writeLog('> final gate passed','live');
          }
        }
        if(ob.y>H+100)obstacles.splice(i,1);
      }

      for(let i=signals.length-1;i>=0;i--){
        const s=signals[i];s.y+=s.speed*timeScale;s.spin+=.06;
        if(signalHit(s)){
          clarity=clamp(clarity+28,0,100);score+=240*combo;combo=clamp(combo+1,1,9);maxCombo=Math.max(maxCombo,combo);comboTimer=150;
          emit(s.x,s.y,'255,201,120',22,.95);writeLog('> signal acquired: '+s.word,'live');sfx.collect();signals.splice(i,1);continue;
        }
        if(s.y>H+50)signals.splice(i,1);
      }

      if(finalGatePassed){
        clearTimer--;if(clearTimer<=0)completeRun();
      }

      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.976;p.vy*=.976;p.life--;
        if(p.life<=0)particles.splice(i,1);
      }
      for(let i=trails.length-1;i>=0;i--){
        const t=trails[i];t.x+=t.vx;t.life--;if(t.life<=0)trails.splice(i,1);
      }
      if(shake>0)shake*=.88;
      updateHud();
    }

    function drawSky(){
      const d=difficulty(),focus=focusTimer>0;
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,focus?'#06141a':'#03060b');g.addColorStop(.52,focus?'#08131b':'#070b14');g.addColorStop(1,'#010207');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

      for(const s of stars){
        s.y+=s.z*(.35+d*.10)*(focus?.48:1);if(s.y>H){s.y=-3;s.x=Math.random()*W}
        ctx.fillStyle=`rgba(215,253,255,${.05+s.z*.12})`;ctx.fillRect(s.x,s.y,s.s*s.z,s.s*s.z);
      }

      // city layers
      const horizon=H*.43;
      city.forEach((b,i)=>{
        const par=[.06,.10,.15][b.layer], offset=(frame*par)%(W+120);
        let x=(b.x-offset+W+120)%(W+120)-60;
        const baseY=horizon+42+b.layer*28, alpha=[.026,.038,.052][b.layer];
        ctx.fillStyle=`rgba(${b.layer===2?80:120},${b.layer===1?110:210},255,${alpha})`;
        ctx.fillRect(x,baseY-b.h,b.w,b.h);
        ctx.fillStyle=`rgba(115,255,241,${alpha*.7})`;
        for(let wy=baseY-b.h+12;wy<baseY-8;wy+=18){
          if(((wy+i*13)|0)%3===0)ctx.fillRect(x+7,wy,2,4);
          if(b.w>42&&((wy+i*7)|0)%4===0)ctx.fillRect(x+b.w-11,wy,2,4);
        }
      });

      // hologram billboards
      const billboards=[
        {x:W*.10,y:H*.29,w:Math.min(185,W*.18),h:58,t:'VALUE // INDEX'},
        {x:W*.68,y:H*.24,w:Math.min(225,W*.22),h:66,t:'APPROVAL MARKET'},
        {x:W*.76,y:H*.49,w:Math.min(170,W*.17),h:50,t:'TREND / LIVE'}
      ];
      billboards.slice(0,portraitMode?1:billboards.length).forEach((b,i)=>{
        const flick=.45+Math.sin(frame*.035+i)*.14;
        ctx.strokeStyle=`rgba(115,255,241,${.06*flick})`;ctx.fillStyle=`rgba(12,52,60,${.045*flick})`;
        ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);
        ctx.fillStyle=`rgba(152,255,246,${.10*flick})`;ctx.font='700 10px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(b.t,b.x+b.w/2,b.y+b.h/2+3);
      });

      // perspective road
      const roadTop=H*.37, roadBottom=H+15;
      ctx.fillStyle='rgba(4,11,18,.78)';
      ctx.beginPath();ctx.moveTo(W*(portraitMode?.34:.39),roadTop);ctx.lineTo(W*(portraitMode?.66:.61),roadTop);ctx.lineTo(W*(portraitMode?.96:.84),roadBottom);ctx.lineTo(W*(portraitMode?.04:.16),roadBottom);ctx.closePath();ctx.fill();

      for(let i=-7;i<=7;i++){
        const endX=W/2+i*75;ctx.strokeStyle=focus?'rgba(115,255,241,.13)':'rgba(115,255,241,.055)';
        ctx.beginPath();ctx.moveTo(W/2,roadTop);ctx.lineTo(endX,roadBottom);ctx.stroke();
      }
      const scroll=(frame*(2.0+d*.34))%50;
      for(let y=roadTop+scroll;y<roadBottom;y+=50){
        const t=(y-roadTop)/(roadBottom-roadTop), curve=roadTop+(roadBottom-roadTop)*t*t;
        ctx.strokeStyle=`rgba(115,255,241,${.018+t*.075})`;ctx.beginPath();ctx.moveTo(W*(portraitMode?.04:.16),curve);ctx.lineTo(W*(portraitMode?.96:.84),curve);ctx.stroke();
      }

      for(const r of rain){
        r.y+=r.s*(focus?.4:1);r.x-=r.s*.22*(focus?.4:1);
        if(r.y>H+20||r.x<-20){r.y=-20;r.x=Math.random()*W}
        ctx.strokeStyle=`rgba(185,242,246,${r.a})`;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-r.l*.28,r.y+r.l);ctx.stroke();
      }

      for(const bw of backgroundWords){
        bw.y+=bw.speed*(focus?.45:1);if(bw.y>H+35){bw.y=-22;bw.x=rand(60,W-60)}
        ctx.save();ctx.globalAlpha=bw.alpha;ctx.fillStyle='#e3f9fb';ctx.font='700 13px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillText(bw.data.word,bw.x,bw.y);ctx.restore();
      }

      if(currentPhase>=2){
        ctx.strokeStyle=`rgba(182,156,255,${.018+currentPhase*.009})`;
        for(let i=0;i<22;i++){
          const x=(i*67+frame*3.6)%W,y=(i*41+frame*(6.6+currentPhase))%H;
          ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+20+currentPhase*8);ctx.stroke();
        }
      }

      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.022)';ctx.font='800 66px "Segoe UI",sans-serif';ctx.fillText('T-ACT',W/2,H*.175);
      ctx.font='600 13px ui-monospace,monospace';ctx.fillText('REALITY / STRUCTURE / RECORD',W/2,H*.21);
    }

    function drawTrails(){
      for(const t of trails){
        const a=t.life/t.max;ctx.fillStyle=`rgba(115,255,241,${a*.11})`;ctx.beginPath();ctx.ellipse(t.x,t.y,10*a,31*a,0,0,Math.PI*2);ctx.fill();
      }
    }

    function drawPlayer(){
      const pulse=.88+Math.sin(player.glow)*.10,focus=focusTimer>0;
      ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.tilt*.26);
      ctx.shadowBlur=focus?46:28;ctx.shadowColor=focus?'rgba(255,255,255,.95)':'rgba(115,255,241,.92)';
      const grad=ctx.createLinearGradient(0,-30,0,24);grad.addColorStop(0,focus?'#ffffff':'#c8fffb');grad.addColorStop(.55,focus?'#ebffff':'#73fff1');grad.addColorStop(1,focus?'#b69cff':'#1cc9bd');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(20,-5);ctx.lineTo(13,25);ctx.lineTo(0,16);ctx.lineTo(-13,25);ctx.lineTo(-20,-5);ctx.closePath();ctx.fill();
      ctx.lineWidth=2.4;
      ctx.strokeStyle=focus?'rgba(255,255,255,.95)':'rgba(220,255,252,.90)';
      ctx.stroke();
      ctx.shadowBlur=12;ctx.fillStyle='rgba(255,255,255,.68)';ctx.fillRect(-2,-15,4,25);
      ctx.fillStyle=`rgba(255,255,255,${.08+.06*pulse})`;ctx.beginPath();ctx.arc(0,3,24*pulse,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    function drawObstacle(ob){
      const focus=focusTimer>0,pulse=.65+Math.sin(ob.pulse)*.12;
      ctx.save();
      const grad=ctx.createLinearGradient(ob.x,ob.y,ob.x+ob.w,ob.y+ob.h);
      if(focus){
        grad.addColorStop(0,'rgba(115,255,241,.055)');grad.addColorStop(1,'rgba(182,156,255,.035)');
        ctx.strokeStyle=ob.final?'rgba(255,255,255,.84)':'rgba(115,255,241,.48)';ctx.setLineDash(ob.final?[4,4]:[8,7]);
      }else{
        const base=ob.final?'.64':(.27+pulse*.17).toFixed(2);
        grad.addColorStop(0,ob.final?`rgba(255,95,151,${base})`:`rgba(171,142,255,${base})`);
        grad.addColorStop(1,ob.final?'rgba(117,49,89,.74)':`rgba(76,66,198,${.31+pulse*.13})`);
        ctx.strokeStyle=ob.final?'rgba(255,201,220,.56)':'rgba(213,199,255,.24)';
      }
      ctx.shadowBlur=ob.final?28:(focus?8:18);ctx.shadowColor=ob.final?'rgba(255,95,151,.46)':(focus?'rgba(115,255,241,.34)':'rgba(172,143,255,.32)');
      ctx.fillStyle=grad;ctx.fillRect(ob.x,ob.y,ob.w,ob.h);ctx.strokeRect(ob.x+.5,ob.y+.5,ob.w-1,ob.h-1);ctx.setLineDash([]);

      // top tech line
      ctx.fillStyle=focus?'rgba(115,255,241,.38)':'rgba(255,255,255,.17)';ctx.fillRect(ob.x,ob.y,ob.w,2);
      ctx.textAlign='center';
      const approach=clamp((ob.y-(H*.08))/(H*.78),0,1);
      const portraitBase=portraitMode?(ob.w>W*.32?23:20):(ob.w>150?19:17);
      const labelSize=Math.round(portraitBase+approach*(portraitMode?12:9));
      const labelY=ob.y+ob.h/2+labelSize*.33;
      const labelW=Math.min(ob.w-8,Math.max(portraitMode?68:54,ob.data.word.length*labelSize*.96));
      ctx.fillStyle=focus?'rgba(3,15,18,.70)':'rgba(4,5,12,.66)';
      ctx.fillRect(ob.x+ob.w/2-labelW/2,labelY-labelSize*.88,labelW,labelSize*1.18);
      ctx.shadowBlur=focus?18:16;
      ctx.shadowColor=focus?'rgba(115,255,241,.82)':'rgba(0,0,0,.98)';
      ctx.fillStyle=focus?'rgba(232,255,253,1)':'rgba(255,255,255,1)';
      ctx.font=`900 ${labelSize}px "Avenir Next","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
      ctx.fillText(ob.data.word,ob.x+ob.w/2,labelY);
      if(focus&&ob.w>120){
        ctx.font='800 9px "Avenir Next","Helvetica Neue",sans-serif';ctx.fillStyle='rgba(115,255,241,.68)';
        const msg=ob.data.en.length>30?ob.data.en.slice(0,30)+'…':ob.data.en;ctx.fillText(msg,ob.x+ob.w/2,ob.y+ob.h-6);
      }
      ctx.restore();
    }

    function drawSignals(){
      for(const s of signals){
        ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.spin);ctx.shadowBlur=22;ctx.shadowColor='rgba(255,201,120,.6)';
        ctx.strokeStyle='rgba(255,214,148,.82)';ctx.fillStyle='rgba(255,201,120,.12)';
        ctx.beginPath();ctx.moveTo(0,-s.r);ctx.lineTo(s.r,0);ctx.lineTo(0,s.r);ctx.lineTo(-s.r,0);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.rotate(-s.spin);ctx.font='700 7px "Segoe UI",sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,228,182,.72)';ctx.fillText(s.word,0,23);ctx.restore();
      }
    }

    function drawParticles(){
      for(const p of particles){
        const a=Math.max(0,p.life/p.max);ctx.fillStyle=`rgba(${p.color},${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();
      }
    }

    function drawFocusRoute(){
      if(focusTimer<=0)return;
      ctx.save();ctx.setLineDash([10,10]);ctx.lineWidth=1;
      ctx.strokeStyle='rgba(115,255,241,.22)';ctx.beginPath();ctx.moveTo(player.x,player.y-25);ctx.lineTo(player.x,H*.25);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle='rgba(115,255,241,.08)';ctx.fillRect(player.x-32,0,64,H);
      ctx.restore();
    }

    function drawCountdown(){
      if(state!=='countdown')return;
      const n=Math.max(1,Math.ceil(countdown/55)),alpha=.66+Math.sin(countdown*.11)*.20;
      ctx.save();ctx.textAlign='center';ctx.fillStyle=`rgba(238,255,255,${alpha})`;ctx.font='850 82px "Segoe UI",sans-serif';ctx.shadowBlur=28;ctx.shadowColor='rgba(115,255,241,.34)';ctx.fillText(n,W/2,H/2+20);
      ctx.font='700 9px ui-monospace,monospace';ctx.fillText('READ THE STRUCTURE',W/2,H/2+50);ctx.restore();
    }

    function render(){
      ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
      drawSky();drawFocusRoute();drawTrails();
      for(const ob of obstacles)drawObstacle(ob);
      drawSignals();drawPlayer();drawParticles();drawCountdown();
      ctx.restore();
    }

    function loop(){update();render();requestAnimationFrame(loop)}

    function setKey(code,on){
      if(code==='ArrowLeft'||code==='KeyA')input.left=on;
      if(code==='ArrowRight'||code==='KeyD')input.right=on;
    }

    addEventListener('keydown',e=>{
      if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
      setKey(e.code,true);
      if(e.code==='Space'&&!e.repeat)activateFocus();
      if((e.code==='Enter'||e.code==='Space')&&state==='title'){document.getElementById('startBtn')?.click()}
      if(e.code==='Escape'&&(state==='running'||state==='paused'))togglePause();
    });
    addEventListener('keyup',e=>setKey(e.code,false));

    function bindHold(btn,side){
      const on=e=>{e.preventDefault();input[side]=true;input.pointer=false};
      const off=e=>{if(e)e.preventDefault();input[side]=false};
      btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
    }
    bindHold(btnLeft,'left');bindHold(btnRight,'right');
    btnFocus.addEventListener('click',()=>{ensureAudio();activateFocus()});

    canvas.addEventListener('pointerdown',e=>{
      if(state!=='running'&&state!=='countdown')return;
      input.pointer=true;const r=canvas.getBoundingClientRect();input.targetX=(e.clientX-r.left)/r.width*W;canvas.setPointerCapture?.(e.pointerId);
    });
    canvas.addEventListener('pointermove',e=>{
      if(!input.pointer)return;const r=canvas.getBoundingClientRect();input.targetX=(e.clientX-r.left)/r.width*W;
    });
    canvas.addEventListener('pointerup',()=>input.pointer=false);
    canvas.addEventListener('pointercancel',()=>input.pointer=false);

    function toggleSound(){
      soundOn=!soundOn;
      if(!soundOn)pauseBgm();else if(state==='running'){ensureAudio();bgm.play().catch(()=>{})}
      updateHud();sfx.ui();
    }
    function togglePause(){
      if(state==='running'){
        beforePause='running';state='paused';pauseBgm();setCard(pauseHtml());overlay.style.display='flex';
        document.getElementById('resumeBtn').addEventListener('click',()=>togglePause(),{once:true});
      }else if(state==='paused'){
        state=beforePause;overlay.style.display='none';resumeBgm();
      }
      updateHud();
    }
    soundBtn.addEventListener('click',toggleSound);
    pauseBtn.addEventListener('click',()=>{if(state==='running'||state==='paused')togglePause()});

    showTitle();loop();
  })();
  </script>
</body>
