<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-ACT // STRUCTURE RUN</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(0,255,220,0.08), transparent 30%),
        radial-gradient(circle at bottom, rgba(120,90,255,0.14), transparent 35%),
        linear-gradient(180deg, #05060a 0%, #090b14 45%, #04050a 100%);
      color: #eafcff;
    }

    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      touch-action: none;
      width: min(100vw, 100vh * 1.55);
      height: min(64.5vw, 100vh);
      border: 1px solid rgba(120,255,240,0.18);
      box-shadow:
        0 0 20px rgba(0,255,210,0.10),
        0 0 60px rgba(123,97,255,0.08),
        inset 0 0 24px rgba(255,255,255,0.03);
      background: linear-gradient(180deg, rgba(5,8,18,0.95), rgba(3,5,11,0.98));
      border-radius: 18px;
      display: block;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 100vh * 1.55);
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 2;
    }

    .hud-right {
      display: flex;
      gap: 12px;
    }

    .panel {
      padding: 10px 14px;
      border: 1px solid rgba(120,255,240,0.12);
      background: rgba(8, 12, 22, 0.45);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      box-shadow: 0 0 18px rgba(0,255,220,0.08);
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(210, 250, 255, 0.7);
      margin-bottom: 4px;
    }

    .value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(5,12,20,0.35), rgba(2,4,10,0.82));
      z-index: 4;
    }

    .card {
      width: min(88vw, 540px);
      padding: 28px;
      border-radius: 24px;
      background: rgba(7, 10, 18, 0.70);
      border: 1px solid rgba(130,255,245,0.16);
      box-shadow:
        0 0 24px rgba(0,255,220,0.12),
        0 0 60px rgba(110,84,255,0.12);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,255,220,0.35);
    }

    p {
      margin: 10px 0;
      line-height: 1.8;
      color: rgba(232, 250, 255, 0.82);
    }

    .accent {
      color: #79fff0;
      text-shadow: 0 0 10px rgba(121,255,240,0.5);
    }

    .danger {
      color: #bda7ff;
      text-shadow: 0 0 10px rgba(189,167,255,0.5);
    }

    button {
      margin-top: 16px;
      border: none;
      padding: 14px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #031117;
      background: linear-gradient(90deg, #79fff0, #9b8cff);
      box-shadow: 0 0 24px rgba(121,255,240,0.35);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { transform: translateY(-1px) scale(1.02); }
    button:active { transform: translateY(1px) scale(0.99); }

    .footer-note {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(210,240,255,0.38);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 1;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 3;
      pointer-events: auto;
    }

    .control-btn {
      min-width: 86px;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 22px;
      line-height: 1;
    }

    #rankingPanel {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      width: min(320px, 42vw);
      padding: 14px 16px;
      border: 1px solid rgba(120,255,240,0.12);
      background: rgba(8,12,22,0.45);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 0 18px rgba(0,255,220,0.08);
    }

    .ranking-title {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(210,250,255,0.7);
      margin-bottom: 8px;
    }

    #rankingList {
      font-size: 14px;
      line-height: 1.8;
      color: rgba(232,250,255,0.88);
      min-height: 24px;
    }

    .name-input {
      width: 120px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(120,255,240,.18);
      background: rgba(0,0,0,.28);
      color: #eafcff;
      text-align: center;
      font-size: 20px;
      letter-spacing: .12em;
      text-transform: uppercase;
      outline: none;
    }

    .name-input:focus {
      border-color: rgba(121,255,240,.48);
      box-shadow: 0 0 18px rgba(121,255,240,.16);
    }

    .top-player-label {
      font-size: 12px;
      opacity: .6;
      letter-spacing: .2em;
      margin-bottom: 0;
    }

    .top-player-name {
      margin-top: 4px;
      font-size: 24px;
      letter-spacing: .18em;
    }

    @media (max-width: 900px) {
      #rankingPanel { width: min(260px, 48vw); }
    }

    @media (max-width: 768px) {
      .hud {
        top: 10px;
        padding: 0 10px;
      }
      .hud-right { gap: 8px; }
      .panel { padding: 8px 12px; }
      .value { font-size: 18px; }
      #controls {
        bottom: 12px;
        gap: 12px;
      }
      .control-btn {
        min-width: 78px;
        padding: 14px 18px;
      }
      #rankingPanel {
        top: 74px;
        right: 10px;
        bottom: auto;
        width: min(240px, 46vw);
      }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>

    <div class="hud">
      <div class="panel">
        <div class="label">score</div>
        <div class="value" id="score">000000</div>
      </div>
      <div class="hud-right">
        <div class="panel">
          <div class="label">status</div>
          <div class="value" id="phase">STANDBY</div>
        </div>
        <div class="panel">
          <div class="label">rank</div>
          <div class="value" id="liveRank">--</div>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>

    <div id="rankingPanel">
      <div class="ranking-title">award board</div>
      <div style="font-size:12px;opacity:.72;margin-bottom:8px;">PLAY中も表示</div>
      <div id="rankingList"></div>
    </div>

    <div class="footer-note">T-ACT WORLD / REALITY / STRUCTURE / RECORD</div>

    <div id="controls">
      <button id="btnLeft" class="control-btn" aria-label="左へ移動">◀</button>
      <button id="btnRight" class="control-btn" aria-label="右へ移動">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const phaseEl = document.getElementById('phase');
    const liveRankEl = document.getElementById('liveRank');
    const overlay = document.getElementById('overlay');
    const card = document.getElementById('card');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const rankingList = document.getElementById('rankingList');
    const bgm = new Audio('genbakantoku_bgm.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.8;

    const W = canvas.width;
    const H = canvas.height;
    const OFFICIAL_URL = 'https://t-act-official.site/';

    const WORDS = ['ノイズ', '評価', '偏見', '流行', '承認', '供給過多', '幻想', '数字', '比較', '期待'];
    const COMMENT_MAP = {
      'ノイズ': '余計な情報に埋もれたな。取捨選択が甘い。',
      '評価': '他人の物差しに引っかかったな。自分で測れ。',
      '偏見': '固定観念に捕まった。視野を広げろ。',
      '流行': '流れに飲まれたな。軸がブレてる。',
      '承認': '欲しがった時点で負けだ。',
      '供給過多': '量の中で埋もれた。質で抜けろ。',
      '幻想': '現実を見失ったな。足元を見ろ。',
      '数字': '数字に支配されたな。本質を見ろ。',
      '比較': '他人と比べた時点でズレる。',
      '期待': '他人の期待に乗ったな。自分で決めろ。'
    };

    const RANKING_KEY = 'tactStructureRunRanking';
    const BEST_KEY = 'tactStructureRunBest';
    const PLAYER_NAME_KEY = 'tactStructureRunPlayerName';
    const MAX_RANKING = 10;
    const NAME_PATTERN = /^[A-Z0-9._-]{1,6}$/;

    const input = { left: false, right: false };

    let lastHitWord = '';
    let gameState = 'title';
    let score = 0;
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let frame = 0;
    let shake = 0;
    let flash = 0;
    let particles = [];
    let obstacles = [];
    let trails = [];
    let spawnTimer = 0;
    let crownTimer = 0;

    const player = {
      x: W / 2,
      y: H - 110,
      w: 28,
      h: 28,
      speed: 9,
      glow: 0,
      alive: true,
    };

    function sanitizeName(value) {
      return String(value || '').toUpperCase().replace(/[^A-Z0-9._-]/g, '').slice(0, 6);
    }

    function loadRanking() {
      try {
        const parsed = JSON.parse(localStorage.getItem(RANKING_KEY) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.filter((item) => NAME_PATTERN.test(item.name) && Number.isFinite(item.score));
      } catch {
        return [];
      }
    }

    function saveRanking(list) {
      localStorage.setItem(RANKING_KEY, JSON.stringify(list.slice(0, MAX_RANKING)));
    }

    function getRanking() {
      return loadRanking().sort((a, b) => b.score - a.score).slice(0, MAX_RANKING);
    }

    function getStoredPlayerName() {
      return sanitizeName(localStorage.getItem(PLAYER_NAME_KEY) || '');
    }

    function setStoredPlayerName(name) {
      const clean = sanitizeName(name);
      if (clean) localStorage.setItem(PLAYER_NAME_KEY, clean);
    }

    function getTopPlayerName() {
      const ranking = getRanking();
      return ranking.length ? ranking[0].name : '----';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setCardHtml(html) {
      card.innerHTML = html;
    }

    function titleCardHtml() {
      return [
        '<h1>T-ACT // STRUCTURE RUN</h1>',
        '<p class="top-player-label">TOP PLAYER</p>',
        `<p class="accent top-player-name" id="champName">${escapeHtml(getTopPlayerName())}</p>`,
        '<p><span class="danger">構造を抜けろ。</span></p>',
        '<p>都市、ノイズ、評価、供給過多。<br><span class="accent">左右ボタン / マウス左右クリック / キーボード</span></p>',
        '<button id="startBtn">Enter Structure</button>'
      ].join('');
    }

    function awardStoredHtml(name, rank) {
      if (rank === 1) {
        return [
          '<h1 style="color:#ffd54a;text-shadow:0 0 20px rgba(255,213,74,.6);">1ST PLACE</h1>',
          `<p><span class="accent">${escapeHtml(name)}</span></p>`,
          '<p>頂点を更新した。</p>',
          '<button id="restartBtn">Re-Enter</button>'
        ].join('');
      }
      return [
        '<h1>AWARD STORED</h1>',
        `<p><span class="accent">${escapeHtml(name)}</span> // RANK ${String(rank).padStart(2, '0')}</p>`,
        '<p>記録を登録した。</p>',
        '<button id="restartBtn">Re-Enter</button>'
      ].join('');
    }

    function gameOverHtml(hitLabel, comment, rankPos, qualifies) {
      const parts = [
        '<h1>LOG ENDED</h1>',
        `<p>今回の記録: <span class="accent">${String(score).padStart(6, '0')}</span></p>`,
        `<p>最高記録: <span class="danger">${String(best).padStart(6, '0')}</span></p>`,
        `<p>衝突対象: <span class="danger">${escapeHtml(hitLabel)}</span></p>`,
        `<p>${escapeHtml(comment)}</p>`,
        '<p style="opacity:.76;">この構造の正体を知るか？</p>'
      ];

      if (qualifies) {
        parts.push(
          `<p><span class="accent">AWARD ENTRY // RANK ${String(rankPos).padStart(2, '0')}</span></p>`,
          '<div style="display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap;">',
          '<input id="nameInput" class="name-input" type="text" maxlength="6" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NAME">',
          '<button id="saveScoreBtn">Save</button>',
          '</div>',
          '<p style="font-size:12px;opacity:.75;">6文字まで / 英字・数字・ . _ - のみ</p>'
        );
      } else {
        parts.push('<p>AWARD OUT</p>');
      }

      parts.push(
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;">',
        '<button id="restartBtn">Re-Enter</button>',
        '<button id="officialBtn" type="button">Enter T-ACT World</button>',
        '</div>'
      );

      return parts.join('');
    }

    function renderRanking(highlightName = '', highlightScore = null) {
      const ranking = getRanking();
      if (!ranking.length) {
        rankingList.innerHTML = '<div style="opacity:.7;">NO ENTRY</div>';
      } else {
        rankingList.innerHTML = ranking.map((item, index) => {
          const highlight = item.name === highlightName && item.score === highlightScore;
          let medalStyle = '';
          if (index === 0) medalStyle = 'color:#ffd54a;text-shadow:0 0 10px rgba(255,213,74,.35);';
          if (index === 1) medalStyle = 'color:#d9e4f2;text-shadow:0 0 10px rgba(217,228,242,.25);';
          if (index === 2) medalStyle = 'color:#d49a6a;text-shadow:0 0 10px rgba(212,154,106,.25);';
          const style = highlight
            ? `${medalStyle}outline:1px solid rgba(121,255,240,.18);border-radius:8px;padding:2px 6px;background:rgba(121,255,240,.06);`
            : medalStyle;
          return `<div style="display:flex;justify-content:space-between;gap:12px;${style}"><span>${String(index + 1).padStart(2, '0')}.</span><span style="flex:1;text-align:center;letter-spacing:.18em;">${escapeHtml(item.name)}</span><span>${String(item.score).padStart(6, '0')}</span></div>`;
        }).join('');
      }

      const champ = document.getElementById('champName');
      if (champ) champ.textContent = getTopPlayerName();
    }

    function getRankPosition(scoreValue) {
      const ranking = getRanking();
      const position = ranking.findIndex((item) => scoreValue > item.score);
      if (position !== -1) return position + 1;
      if (ranking.length < MAX_RANKING) return ranking.length + 1;
      return null;
    }

    function getLiveRank(scoreValue) {
      const position = getRankPosition(scoreValue);
      return position === null ? 'OUT' : String(position).padStart(2, '0');
    }

    function submitScore(name, scoreValue) {
      const cleanName = sanitizeName(name);
      if (!NAME_PATTERN.test(cleanName)) {
        return { ok: false, reason: 'invalid_name' };
      }

      const currentRanking = getRanking();
      const existing = currentRanking.find((item) => item.name === cleanName);
      const bestScoreForName = existing ? Math.max(existing.score, scoreValue) : scoreValue;
      const merged = currentRanking.filter((item) => item.name !== cleanName);
      merged.push({ name: cleanName, score: bestScoreForName });
      merged.sort((a, b) => b.score - a.score);

      const trimmed = merged.slice(0, MAX_RANKING);
      saveRanking(trimmed);
      setStoredPlayerName(cleanName);
      renderRanking(cleanName, bestScoreForName);

      return {
        ok: true,
        rank: trimmed.findIndex((item) => item.name === cleanName) + 1,
        name: cleanName,
        score: bestScoreForName,
        updated: !existing || bestScoreForName > existing.score,
      };
    }

    function difficulty() {
      return 1 + Math.min(score / 900, 4.8);
    }

    function phaseName() {
      const d = difficulty();
      if (d < 1.8) return 'RECORD';
      if (d < 2.7) return 'PRESSURE';
      if (d < 3.7) return 'DENSITY';
      if (d < 4.7) return 'OVERLOAD';
      return 'SURVIVE';
    }

    function updateHud() {
      scoreEl.textContent = String(score).padStart(6, '0');
      phaseEl.textContent = gameState === 'running' ? phaseName() : 'STANDBY';
      liveRankEl.textContent = gameState === 'running' ? getLiveRank(score) : '--';
    }

    function emitParticles(x, y, color, count, spread = 1) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 8 * spread,
          vy: (Math.random() - 0.5) * 8 * spread,
          life: 20 + Math.random() * 30,
          maxLife: 40,
          size: 1 + Math.random() * 3,
          color,
        });
      }
    }

    function attachRestartHandler() {
      const restartBtn = document.getElementById('restartBtn');
      if (restartBtn) restartBtn.addEventListener('click', resetGame, { once: true });
    }

    function attachOfficialHandler() {
      const officialBtn = document.getElementById('officialBtn');
      if (officialBtn) {
        officialBtn.addEventListener('click', () => {
          window.location.href = OFFICIAL_URL;
        }, { once: true });
      }
    }

    function showTitleScreen() {
      pauseBgm();
      setCardHtml(titleCardHtml());
      overlay.style.display = 'flex';
      document.getElementById('startBtn').addEventListener('click', resetGame, { once: true });
      renderRanking();
      updateHud();
    }

    async function playBgm() {
      try {
        bgm.currentTime = 0;
        await bgm.play();
      } catch (error) {
        console.warn('BGM playback was blocked or failed.', error);
      }
    }

    function stopBgm() {
      bgm.pause();
      bgm.currentTime = 0;
    }

    function pauseBgm() {
      bgm.pause();
    }

    function resetGame() {
      score = 0;
      frame = 0;
      shake = 0;
      flash = 0;
      spawnTimer = 0;
      lastHitWord = '';
      particles = [];
      obstacles = [];
      trails = [];
      input.left = false;
      input.right = false;
      player.x = W / 2;
      player.y = H - 110;
      player.alive = true;
      gameState = 'running';
      overlay.style.display = 'none';
      playBgm();
      updateHud();
    }

    function showAwardStored(name, rank) {
      pauseBgm();
      if (rank === 1) {
        flash = 2;
        crownTimer = 180;
        emitParticles(W / 2, H / 2, '255,215,0', 120, 2.5);
      }
      setCardHtml(awardStoredHtml(name, rank));
      overlay.style.display = 'flex';
      attachRestartHandler();
    }

    function endGame() {
      pauseBgm();
      gameState = 'gameover';
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }

      const hitLabel = lastHitWord || '構造';
      const comment = COMMENT_MAP[hitLabel] || '構造に負けたな。';
      const rankPos = getRankPosition(score);
      const qualifies = rankPos !== null;

      setCardHtml(gameOverHtml(hitLabel, comment, rankPos, qualifies));
      overlay.style.display = 'flex';
      attachRestartHandler();
      attachOfficialHandler();

      if (qualifies) {
        const nameInput = document.getElementById('nameInput');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        nameInput.value = getStoredPlayerName();

        nameInput.addEventListener('input', () => {
          nameInput.value = sanitizeName(nameInput.value);
        });

        const saveHandler = () => {
          const result = submitScore(nameInput.value, score);
          if (!result.ok) {
            nameInput.value = sanitizeName(nameInput.value);
            nameInput.focus();
            return;
          }
          showAwardStored(result.name, result.rank);
        };

        saveScoreBtn.addEventListener('click', saveHandler, { once: true });
        nameInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') saveHandler();
        });
        setTimeout(() => nameInput.focus(), 30);
      }
      updateHud();
    }

    function keySet(code, value) {
      if (code === 'ArrowLeft' || code === 'KeyA') input.left = value;
      if (code === 'ArrowRight' || code === 'KeyD') input.right = value;
      if ((code === 'Space' || code === 'Enter') && value && gameState !== 'running') {
        showTitleScreen();
      }
    }

    addEventListener('keydown', (event) => {
      keySet(event.code, true);
      if (['ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(event.code)) event.preventDefault();
    });

    addEventListener('keyup', (event) => {
      keySet(event.code, false);
    });

    canvas.addEventListener('mousedown', (event) => {
      if (gameState !== 'running') return;
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      input.left = x < rect.width / 2;
      input.right = x >= rect.width / 2;
    });

    canvas.addEventListener('mouseup', () => {
      input.left = false;
      input.right = false;
    });

    canvas.addEventListener('mouseleave', () => {
      input.left = false;
      input.right = false;
    });

    function bindHoldButton(button, side) {
      const setState = (pressed) => {
        input[side] = pressed;
        input[side === 'left' ? 'right' : 'left'] = false;
      };

      button.addEventListener('mousedown', (event) => {
        event.preventDefault();
        setState(true);
      });
      button.addEventListener('mouseup', () => setState(false));
      button.addEventListener('mouseleave', () => setState(false));
      button.addEventListener('touchstart', (event) => {
        event.preventDefault();
        setState(true);
      }, { passive: false });
      button.addEventListener('touchend', (event) => {
        event.preventDefault();
        setState(false);
      }, { passive: false });
      button.addEventListener('touchcancel', () => setState(false));
    }

    bindHoldButton(btnLeft, 'left');
    bindHoldButton(btnRight, 'right');

    function spawnObstacle() {
      const d = difficulty();
      const wide = Math.random() < 0.28;
      const w = wide ? 180 + Math.random() * 120 : 40 + Math.random() * 50;
      const speed = 6 + Math.random() * 2.4 + d * 1.4;
      const word = WORDS[Math.floor(Math.random() * WORDS.length)];

      obstacles.push({
        x: Math.random() * (W - w),
        y: -60,
        w,
        h: 22 + Math.random() * 22,
        speed,
        pulse: Math.random() * Math.PI * 2,
        word,
      });
    }

    function update() {
      if (crownTimer > 0) crownTimer -= 1;
      if (gameState !== 'running') return;

      frame += 1;
      score += 1;
      player.glow += 0.12;
      if (shake > 0) shake *= 0.9;
      if (flash > 0) flash *= 0.9;

      const dir = (input.left ? -1 : 0) + (input.right ? 1 : 0);
      player.x += dir * player.speed;
      player.x = Math.max(30, Math.min(W - 30, player.x));

      trails.push({ x: player.x, y: player.y + 10, life: 18 });
      if (trails.length > 60) trails.shift();

      spawnTimer -= 1;
      if (spawnTimer <= 0) {
        spawnObstacle();
        const d = difficulty();
        spawnTimer = Math.max(10, 36 - d * 4 - Math.random() * 8);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.y += ob.speed;
        ob.pulse += 0.06;

        const hit =
          player.x + player.w / 2 > ob.x &&
          player.x - player.w / 2 < ob.x + ob.w &&
          player.y + player.h / 2 > ob.y &&
          player.y - player.h / 2 < ob.y + ob.h;

        if (hit) {
          lastHitWord = ob.word;
          emitParticles(player.x, player.y, '255,120,180', 40, 1.4);
          shake = 18;
          flash = 1;
          endGame();
          return;
        }

        if (ob.y > H + 80) {
          obstacles.splice(i, 1);
          emitParticles(ob.x + ob.w / 2, H - 20, '130,240,255', 5, 0.6);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].life -= 1;
        if (trails[i].life <= 0) trails.splice(i, 1);
      }

      if (frame % 8 === 0) emitParticles(player.x, player.y + 8, '121,255,240', 1, 0.25);
      updateHud();
    }

    function drawBackground() {
      const t = frame * 0.01;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#05070d');
      g.addColorStop(0.45, '#0a0d16');
      g.addColorStop(1, '#030407');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      if (crownTimer > 0) {
        ctx.fillStyle = 'rgba(255,215,0,0.08)';
        ctx.fillRect(0, 0, W, H);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      for (let i = 0; i < 80; i++) {
        const x = (i * 173) % W;
        const y = (i * 97 + frame * 0.35) % H;
        ctx.fillRect(x, y, 2, 2);
      }

      for (let i = 0; i < 20; i++) {
        const y = (i * 50 + (frame * 2.2)) % (H + 80) - 40;
        ctx.strokeStyle = `rgba(100, 255, 240, ${0.03 + (i % 2) * 0.015})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      for (let i = 0; i < 9; i++) {
        const x = i * (W / 8) + Math.sin(t + i) * 8;
        ctx.strokeStyle = 'rgba(170, 150, 255, 0.05)';
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(120,255,240,0.045)';
      ctx.fillRect(W * 0.18, H * 0.12, W * 0.64, 2);
      ctx.fillRect(W * 0.25, H * 0.2, W * 0.5, 2);

      ctx.textAlign = 'center';
      ctx.font = '700 62px Segoe UI, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.028)';
      ctx.fillText('T-ACT', W / 2, H * 0.22);
      ctx.font = '500 20px Segoe UI, sans-serif';
      ctx.fillText('REALITY / STRUCTURE / RECORD', W / 2, H * 0.27);
    }

    function drawTrails() {
      for (const tr of trails) {
        const alpha = tr.life / 18;
        ctx.fillStyle = `rgba(121,255,240,${alpha * 0.12})`;
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, 20 * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const pulse = 0.8 + Math.sin(player.glow) * 0.15;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowBlur = 28;
      ctx.shadowColor = 'rgba(121,255,240,0.95)';
      ctx.fillStyle = `rgba(121,255,240,${0.82 * pulse})`;
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(18, -2);
      ctx.lineTo(10, 20);
      ctx.lineTo(0, 14);
      ctx.lineTo(-10, 20);
      ctx.lineTo(-18, -2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(-2, -12, 4, 18);
      ctx.shadowBlur = 50;
      ctx.fillStyle = 'rgba(180,245,255,0.26)';
      ctx.beginPath();
      ctx.arc(0, 4, 22 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawObstacles() {
      ctx.textAlign = 'center';
      ctx.font = '700 11px Segoe UI, sans-serif';
      for (const ob of obstacles) {
        const p = 0.45 + Math.sin(ob.pulse) * 0.12;
        ctx.save();
        ctx.shadowBlur = 22;
        ctx.shadowColor = 'rgba(155,140,255,0.7)';
        ctx.fillStyle = `rgba(155,140,255,${0.68 + p * 0.25})`;
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(ob.x, ob.y, ob.w, 3);
        ctx.fillStyle = 'rgba(255,255,255,0.60)';
        ctx.fillText(ob.word, ob.x + ob.w / 2, ob.y + ob.h - 6);
        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = `rgba(${p.color},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawVignette() {
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.16, W / 2, H / 2, H * 0.72);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.48)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    function render() {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      drawBackground();
      drawTrails();
      drawObstacles();
      drawPlayer();
      drawParticles();
      drawVignette();
      if (flash > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${flash * 0.35})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function runSelfChecks() {
      console.assert(Array.isArray(WORDS) && WORDS.length > 0, 'WORDS should be a non-empty array');
      console.assert(typeof COMMENT_MAP['評価'] === 'string', 'COMMENT_MAP should include known labels');
      console.assert(sanitizeName('a1b$cd') === 'A1BCD', 'sanitizeName should keep allowed letters and digits');
      console.assert(sanitizeName('abCD12-._') === 'ABCD12', 'sanitizeName should cap at six characters');
      console.assert(NAME_PATTERN.test('TACT-1') === true, 'NAME_PATTERN should allow up to six chars including dash');
      console.assert(NAME_PATTERN.test('AA@@') === false, 'NAME_PATTERN should reject unsupported symbols');
      console.assert(titleCardHtml().includes('TOP PLAYER'), 'title card html should render');
      console.assert(awardStoredHtml('TACT', 2).includes('AWARD STORED'), 'award stored html should render');
      console.assert(gameOverHtml('評価', 'test', 1, true).includes('saveScoreBtn'), 'game over html should include save button when qualified');
      console.assert(gameOverHtml('評価', 'test', 1, true).includes('officialBtn'), 'game over html should include official site button');
      console.assert(typeof phaseName() === 'string', 'phaseName should return a string');
      console.assert(getRankPosition(999999) === 1 || getRankPosition(999999) !== null, 'getRankPosition should return a valid position for large score');
      console.assert(typeof getLiveRank(500) === 'string', 'getLiveRank should return a display string');
      console.assert(typeof playBgm === 'function' && typeof stopBgm === 'function', 'BGM control functions should exist');

      const before = getRanking().length;
      const valid = submitScore('T-ACT', 1234);
      console.assert(valid.ok === true, 'submitScore should accept up to 6 allowed chars');
      const improved = submitScore('T-ACT', 2222);
      console.assert(improved.ok === true && improved.score === 2222, 'same name should keep highest score');
      const invalid = submitScore('T3!@@', 999);
      console.assert(invalid.ok === false, 'submitScore should reject invalid names');
      const after = getRanking().length;
      console.assert(after >= before, 'ranking length should not shrink after valid submit');
      console.assert(getTopPlayerName().length >= 1, 'top player name should be available after test submit');
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    runSelfChecks();
    renderRanking();
    showTitleScreen();
    loop();
  </script>
</body>
</html>
